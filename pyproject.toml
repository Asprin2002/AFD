[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "elasticafd"
version = "0.11.0"
description = "Decode-only GPU + DIMM-PIM simulator with legacy and layout-aware scheduling models"
readme = "README.md"
requires-python = ">=3.9"
dependencies = ["PyYAML>=6.0"]

[project.scripts]
elasticafd = "elasticafd.cli:main"

[tool.setuptools.packages.find]
include = ["elasticafd*"]
