model: gpt175b
hardware:
  preset: chime_a100
  gpu:
    runtime_reserve_gib: 0
    kv_capacity_limit_gib: 32
workload:
  type: static_batch
  batch_size: 12
  input_tokens: 5200
  output_tokens: 1024
simulation:
  max_batch_size: 12
  fidelity: tile
  pipeline_model: analytic
  subbatch_scheduler: lpt
  operator_mapping: chime
  record_every: 512
  allow_gpu_prompt_fallback: false
  policy:
    name: elastic
    optimizer: global_exact
    prediction: oracle
    decision_interval: 512
    planning_horizon_tokens: 256
    lifetime_evaluation_stride_tokens: 16
    min_segment_tokens: 512
    min_switch_interval: 512
    relative_improvement_threshold: 0
    max_switches_per_decision: 8
    exact_max_candidates: 12
    exact_max_cost_evaluations: 400000

