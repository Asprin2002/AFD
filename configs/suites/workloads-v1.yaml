version: 1
name: workloads-v1
description: >-
  AFD Workloads v1. E0 establishes a decode-only CHIME baseline over offline
  homogeneous, offline heterogeneous, workstation, and synthetic online
  workloads. The screen tier uses the calibrated tile cost model with the
  analytic pipeline; later stages replay selected cases with the event DAG.

templates:
  server_chime_screen:
    model: gpt175b
    hardware:
      preset: chime_a100
      gpu:
        runtime_reserve_gib: 0
    workload:
      type: static_batch
      batch_size: 1
      input_tokens: 512
      output_tokens: 128
    simulation:
      max_batch_size: 64
      fidelity: tile
      pipeline_model: analytic
      subbatch_scheduler: lpt
      operator_mapping: chime
      record_every: 256
      admission_scheduler: fcfs
      allow_gpu_prompt_fallback: false
      policy:
        name: chime
        prediction: oracle

  workstation_64g_chime_screen:
    model: opt6.7b
    hardware:
      preset: workstation_pim_64g
    workload:
      type: static_batch
      batch_size: 1
      input_tokens: 512
      output_tokens: 128
    simulation:
      max_batch_size: 4
      fidelity: tile
      pipeline_model: analytic
      subbatch_scheduler: lpt
      operator_mapping: chime
      record_every: 256
      admission_scheduler: fcfs
      allow_gpu_prompt_fallback: false
      policy:
        name: chime
        prediction: oracle

  online_chime_screen:
    model: gpt175b
    hardware:
      preset: chime_a100
      gpu:
        runtime_reserve_gib: 0
    workload:
      type: trace_serving
      synthetic:
        count: 24
        profile: dolphin_short
        arrival_rate_rps: 1.0
        seed: 0
    simulation:
      max_batch_size: 8
      fidelity: tile
      pipeline_model: analytic
      subbatch_scheduler: lpt
      operator_mapping: chime
      record_every: 256
      admission_scheduler: fcfs
      allow_gpu_prompt_fallback: false
      slo_queue_ms: 2000
      slo_tpot_ms: 130
      slo_attainment_target: 0.99
      policy:
        name: chime
        prediction: oracle

stages:
  e0:
    description: >-
      Freeze Workloads-v1 and measure the unmodified CHIME decode baseline.
      No elastic KV placement or dynamic AF scheduling is enabled in E0.
