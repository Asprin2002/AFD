  e1:
    description: >-
      Broad low-cost screen of immutable future-KV placement with exact output
      lengths. F operators remain on GPU. Every workload has a CHIME baseline
      and a reactive lifetime-greedy variant; homogeneous offline workloads
      also have a closed-form full-lifecycle balance-curve plan.
    derived_cases:
      - from_stage: e0
        id_prefix: e1-chime-
        variant: chime
        description_prefix: CHIME paired baseline
        tags: [e1, paired_baseline]
        overrides: {}

      - from_stage: e0
        id_prefix: e1-lifetime-
        variant: future_kv_lifetime
        description_prefix: Reactive exact-length immutable future-KV placement
        tags: [e1, future_kv, exact_length, reactive]
        overrides:
          simulation:
            policy:
              name: elastic
              optimizer: lifetime_greedy
              prediction: oracle
              decision_interval: 256
              planning_horizon_tokens: 256
              lifetime_evaluation_stride_tokens: 256
              min_segment_tokens: 0
              min_switch_interval: 256
              relative_improvement_threshold: 0.002
              max_switches_per_decision: 8
              switch_penalty_us: 0
              event_driven_replan: true

      - from_stage: e0
        id_prefix: e1-balance-
        variant: future_kv_balance_curve
        description_prefix: Offline closed-form full-lifecycle future-KV plan
        scenarios: [offline_homogeneous]
        tags: [e1, future_kv, exact_length, offline_global]
        overrides:
          simulation:
            policy:
              name: elastic
              optimizer: balance_curve
              prediction: oracle
              decision_interval: 64
              planning_horizon_tokens: 256
              min_segment_tokens: 64
              min_switch_interval: 64
              relative_improvement_threshold: 0
              max_switches_per_decision: 64
              switch_penalty_us: 0
              event_driven_replan: false

  e2:
    description: >-
      Representative dependency-aware replay of E1. The main comparison keeps
      the causal exact-length lifetime policy unchanged and replaces the
      analytic pipeline with the rankset event DAG. A separate paired
      sensitivity charges 1 us per attention segment per layer and 10 us per
      tail switch; these values are explicit stress assumptions, not calibrated
      hardware measurements. Two strong homogeneous points also test the
      bounded one-window lifecycle mode requested for deployment-friendly
      offline planning.
    derived_cases:
      # Smoke workloads are promoted from their E0 core tier so the event path
      # can be checked quickly before the expensive long-context replay.
      - from_stage: e0
        id_prefix: e2-event-chime-
        variant: chime
        tier: smoke
        workload_ids:
          - off-homo-b16-i8192-o256
          - on-dolphin-short-n24-r0p5-s0
        description_prefix: Dependency-aware CHIME baseline
        tags: [e2, event_dag, paired_baseline]
        overrides:
          simulation:
            pipeline_model: rankset_event
            record_every: 256
            record_pipeline_events: false

      - from_stage: e0
        id_prefix: e2-event-chime-
        variant: chime
        tier: core
        workload_ids:
          - off-homo-anchor-b16-i5200-o4096
          - off-homo-b64-i2048-o4096
          - off-homo-b4-i8192-o4096
          - off-hetero-output-staircase-b8
          - ws-64g-b1-i32768-o8192
          - on-openr1-n24-r0p04-s0
          - on-openthoughts-n24-r0p06-s0
        description_prefix: Dependency-aware CHIME baseline
        tags: [e2, event_dag, paired_baseline]
        overrides:
          simulation:
            pipeline_model: rankset_event
            record_every: 256
            record_pipeline_events: false

      - from_stage: e0
        id_prefix: e2-event-lifetime-
        variant: future_kv_lifetime_event
        tier: smoke
        workload_ids:
          - off-homo-b16-i8192-o256
          - on-dolphin-short-n24-r0p5-s0
        description_prefix: Causal exact-length lifetime placement on event DAG
        tags: [e2, event_dag, future_kv, exact_length, reactive]
        overrides:
          simulation:
            pipeline_model: rankset_event
            record_every: 256
            record_pipeline_events: false
            policy:
              name: elastic
              optimizer: lifetime_greedy
              prediction: oracle
              decision_interval: 256
              planning_horizon_tokens: 256
              lifetime_evaluation_stride_tokens: 256
              min_segment_tokens: 0
              min_switch_interval: 256
              relative_improvement_threshold: 0.002
              max_switches_per_decision: 8
              switch_penalty_us: 0
              switch_execution_us: 0
              event_driven_replan: true

      - from_stage: e0
        id_prefix: e2-event-lifetime-
        variant: future_kv_lifetime_event
        tier: core
        workload_ids:
          - off-homo-anchor-b16-i5200-o4096
          - off-homo-b64-i2048-o4096
          - off-homo-b4-i8192-o4096
          - off-hetero-output-staircase-b8
          - ws-64g-b1-i32768-o8192
          - on-openr1-n24-r0p04-s0
          - on-openthoughts-n24-r0p06-s0
        description_prefix: Causal exact-length lifetime placement on event DAG
        tags: [e2, event_dag, future_kv, exact_length, reactive]
        overrides:
          simulation:
            pipeline_model: rankset_event
            record_every: 256
            record_pipeline_events: false
            policy:
              name: elastic
              optimizer: lifetime_greedy
              prediction: oracle
              decision_interval: 256
              planning_horizon_tokens: 256
              lifetime_evaluation_stride_tokens: 256
              min_segment_tokens: 0
              min_switch_interval: 256
              relative_improvement_threshold: 0.002
              max_switches_per_decision: 8
              switch_penalty_us: 0
              switch_execution_us: 0
              event_driven_replan: true

      # One bounded GPU-write window: (request count, start token, end token).
      # This directly tests whether E1's high-switch balance curve can be
      # replaced by a deployment-friendly offline mode.
      - from_stage: e0
        id_prefix: e2-event-mode-
        variant: future_kv_mode_event
        tier: core
        workload_ids:
          - off-homo-anchor-b16-i5200-o4096
          - off-homo-b64-i2048-o4096
        description_prefix: Bounded homogeneous lifecycle mode on event DAG
        tags: [e2, event_dag, future_kv, offline_mode]
        overrides:
          simulation:
            pipeline_model: rankset_event
            record_every: 256
            record_pipeline_events: false
            policy:
              name: elastic
              optimizer: homogeneous_modes
              prediction: oracle
              decision_interval: 256
              planning_horizon_tokens: 256
              homogeneous_mode_grid_points: 5
              homogeneous_mode_quadrature_samples: 16
              homogeneous_mode_exact_finalists: 2
              min_segment_tokens: 256
              min_switch_interval: 256
              relative_improvement_threshold: 0
              max_switches_per_decision: 64
              switch_penalty_us: 0
              switch_execution_us: 0
              event_driven_replan: false

      # Paired overhead sensitivity. Workload IDs are suffixed so each has its
      # own CHIME baseline under exactly the same hardware setup costs.
      - from_stage: e0
        id_prefix: e2-overhead-chime-
        workload_id_suffix: -overhead
        variant: chime
        tier: core
        workload_ids:
          - off-homo-anchor-b16-i5200-o4096
          - off-homo-b64-i2048-o4096
          - on-dolphin-short-n24-r0p5-s0
        description_prefix: Event CHIME baseline with overhead sensitivity
        tags: [e2, event_dag, overhead_sensitivity, paired_baseline]
        overrides:
          hardware:
            gpu: {segment_setup_us: 1.0}
            pim: {segment_setup_us: 1.0}
          simulation:
            pipeline_model: rankset_event
            record_every: 256
            record_pipeline_events: false

      - from_stage: e0
        id_prefix: e2-overhead-lifetime-
        workload_id_suffix: -overhead
        variant: future_kv_lifetime_event_overhead
        tier: core
        workload_ids:
          - off-homo-anchor-b16-i5200-o4096
          - off-homo-b64-i2048-o4096
          - on-dolphin-short-n24-r0p5-s0
        description_prefix: Event lifetime placement with overhead sensitivity
        tags: [e2, event_dag, future_kv, overhead_sensitivity]
        overrides:
          hardware:
            gpu: {segment_setup_us: 1.0}
            pim: {segment_setup_us: 1.0}
          simulation:
            pipeline_model: rankset_event
            record_every: 256
            record_pipeline_events: false
            policy:
              name: elastic
              optimizer: lifetime_greedy
              prediction: oracle
              decision_interval: 256
              planning_horizon_tokens: 256
              lifetime_evaluation_stride_tokens: 256
              min_segment_tokens: 0
              min_switch_interval: 256
              relative_improvement_threshold: 0.002
              max_switches_per_decision: 8
              switch_penalty_us: 10.0
              switch_execution_us: 10.0
              event_driven_replan: true
