version: 1
name: attention-split-v2
description: >-
  Decode-ready CHIME experiment suite for isolating immutable future-KV
  Attention splitting.  Existing result directories are not inputs.

templates:
  chime_offline:
    model: gpt175b
    hardware:
      preset: chime_a100
      gpu:
        runtime_reserve_gib: 0
    workload:
      type: static_batch
      batch_size: 4
      input_tokens: 2048
      output_tokens: 4096
    simulation:
      max_batch_size: 32
      fidelity: tile
      pipeline_model: analytic
      subbatch_scheduler: lpt
      operator_mapping: chime
      record_every: 256
      allow_gpu_prompt_fallback: false
      admission_scheduler: fcfs
      split_overhead_scale: 1.0
      policy:
        name: chime
        prediction: oracle

  chime_online:
    model: gpt175b
    hardware:
      preset: chime_a100
      gpu:
        runtime_reserve_gib: 0
    workload:
      type: trace_serving
      synthetic:
        count: 32
        arrival_rate_rps: 0.01
        arrival_pattern: poisson
        seed: 7
        input_tokens: 2048
        output_tokens: 4096
    simulation:
      max_batch_size: 16
      fidelity: tile
      pipeline_model: analytic
      subbatch_scheduler: lpt
      operator_mapping: chime
      record_every: 256
      allow_gpu_prompt_fallback: false
      admission_scheduler: fcfs
      split_overhead_scale: 1.0
      slo_queue_ms: 60000
      slo_tpot_ms: 170
      policy:
        name: chime
        prediction: oracle

stages:
  a1_inputs:
    description: Canonical closed workloads; this stage is not an experiment result.
    cases:
      - id: sl-b4-i2k-o4k
        tier: smoke
        scenario: offline_homogeneous
        template: chime_offline
        tags: [short_input, long_output, homogeneous, b4]
        overrides: {workload: {batch_size: 4, input_tokens: 2048, output_tokens: 4096}}
      - id: ll-b4-i32k-o8k
        tier: smoke
        scenario: offline_homogeneous
        template: chime_offline
        tags: [long_input, long_output, homogeneous, b4]
        overrides: {workload: {batch_size: 4, input_tokens: 32768, output_tokens: 8192}}
      - id: sl-b16-i2k-o4k
        tier: core
        scenario: offline_homogeneous
        template: chime_offline
        tags: [short_input, long_output, homogeneous, b16]
        overrides: {workload: {batch_size: 16, input_tokens: 2048, output_tokens: 4096}}
      - id: ll-b16-i16k-o8k
        tier: core
        scenario: offline_homogeneous
        template: chime_offline
        tags: [long_input, long_output, homogeneous, b16]
        overrides: {workload: {batch_size: 16, input_tokens: 16384, output_tokens: 8192}}
      - id: mixed-b16-i2k32k-o8k
        tier: core
        scenario: offline_heterogeneous
        template: chime_offline
        tags: [mixed_input, long_output, heterogeneous, b16]
        overrides:
          workload:
            type: closed_batch
            batch_size: null
            input_tokens: null
            output_tokens: null
            requests:
              - {request_id: r00, input_tokens: 2048, output_tokens: 8192}
              - {request_id: r01, input_tokens: 2048, output_tokens: 8192}
              - {request_id: r02, input_tokens: 2048, output_tokens: 8192}
              - {request_id: r03, input_tokens: 2048, output_tokens: 8192}
              - {request_id: r04, input_tokens: 2048, output_tokens: 8192}
              - {request_id: r05, input_tokens: 2048, output_tokens: 8192}
              - {request_id: r06, input_tokens: 2048, output_tokens: 8192}
              - {request_id: r07, input_tokens: 2048, output_tokens: 8192}
              - {request_id: r08, input_tokens: 32768, output_tokens: 8192}
              - {request_id: r09, input_tokens: 32768, output_tokens: 8192}
              - {request_id: r10, input_tokens: 32768, output_tokens: 8192}
              - {request_id: r11, input_tokens: 32768, output_tokens: 8192}
              - {request_id: r12, input_tokens: 32768, output_tokens: 8192}
              - {request_id: r13, input_tokens: 32768, output_tokens: 8192}
              - {request_id: r14, input_tokens: 32768, output_tokens: 8192}
              - {request_id: r15, input_tokens: 32768, output_tokens: 8192}
      - id: staircase-b16-i16k-o4k8k
        tier: core
        scenario: offline_heterogeneous
        template: chime_offline
        tags: [long_input, long_output, completion_events, b16]
        overrides:
          workload:
            type: closed_batch
            batch_size: null
            input_tokens: null
            output_tokens: null
            requests:
              - {request_id: r00, input_tokens: 16384, output_tokens: 4096}
              - {request_id: r01, input_tokens: 16384, output_tokens: 4096}
              - {request_id: r02, input_tokens: 16384, output_tokens: 4096}
              - {request_id: r03, input_tokens: 16384, output_tokens: 4096}
              - {request_id: r04, input_tokens: 16384, output_tokens: 4096}
              - {request_id: r05, input_tokens: 16384, output_tokens: 4096}
              - {request_id: r06, input_tokens: 16384, output_tokens: 4096}
              - {request_id: r07, input_tokens: 16384, output_tokens: 4096}
              - {request_id: r08, input_tokens: 16384, output_tokens: 8192}
              - {request_id: r09, input_tokens: 16384, output_tokens: 8192}
              - {request_id: r10, input_tokens: 16384, output_tokens: 8192}
              - {request_id: r11, input_tokens: 16384, output_tokens: 8192}
              - {request_id: r12, input_tokens: 16384, output_tokens: 8192}
              - {request_id: r13, input_tokens: 16384, output_tokens: 8192}
              - {request_id: r14, input_tokens: 16384, output_tokens: 8192}
              - {request_id: r15, input_tokens: 16384, output_tokens: 8192}
      - id: sl-b32-i2k-o4k
        tier: full
        scenario: offline_homogeneous
        template: chime_offline
        tags: [short_input, long_output, homogeneous, b32]
        overrides: {workload: {batch_size: 32, input_tokens: 2048, output_tokens: 4096}}
      - id: ll-b32-i8k-o4k
        tier: full
        scenario: offline_homogeneous
        template: chime_offline
        tags: [long_input, long_output, homogeneous, b32]
        overrides: {workload: {batch_size: 32, input_tokens: 8192, output_tokens: 4096}}

  a1_screen:
    description: Forced future-KV GPU-writer fractions on the analytic CHIME pipeline.
    derived_cases:
      - from_stage: a1_inputs
        id_prefix: a1s-chime-
        variant: chime
        description_prefix: CHIME control
      - from_stage: a1_inputs
        id_prefix: a1s-p25-
        variant: forced_p25
        description_prefix: 25 percent future-KV GPU writers
        overrides:
          simulation:
            policy: {name: elastic, optimizer: forced_fraction, forced_gpu_fraction: 0.25}
      - from_stage: a1_inputs
        id_prefix: a1s-p50-
        variant: forced_p50
        description_prefix: 50 percent future-KV GPU writers
        overrides:
          simulation:
            policy: {name: elastic, optimizer: forced_fraction, forced_gpu_fraction: 0.50}
      - from_stage: a1_inputs
        id_prefix: a1s-p75-
        variant: forced_p75
        description_prefix: 75 percent future-KV GPU writers
        overrides:
          simulation:
            policy: {name: elastic, optimizer: forced_fraction, forced_gpu_fraction: 0.75}
      - from_stage: a1_inputs
        id_prefix: a1s-p100-
        variant: forced_p100
        description_prefix: 100 percent future-KV GPU writers
        overrides:
          simulation:
            policy: {name: elastic, optimizer: forced_fraction, forced_gpu_fraction: 1.0}

  a1_event:
    description: Dependency-aware replay of the two homogeneous B16 split curves.
    derived_cases:
      - from_stage: a1_inputs
        workload_ids: [sl-b16-i2k-o4k, ll-b16-i16k-o8k]
        id_prefix: a1e-chime-
        variant: chime
        tier: core
        overrides: {simulation: {pipeline_model: rankset_event, record_every: 512}}
      - from_stage: a1_inputs
        workload_ids: [sl-b16-i2k-o4k, ll-b16-i16k-o8k]
        id_prefix: a1e-p25-
        variant: forced_p25
        tier: core
        overrides:
          simulation:
            pipeline_model: rankset_event
            record_every: 512
            policy: {name: elastic, optimizer: forced_fraction, forced_gpu_fraction: 0.25}
      - from_stage: a1_inputs
        workload_ids: [sl-b16-i2k-o4k, ll-b16-i16k-o8k]
        id_prefix: a1e-p50-
        variant: forced_p50
        tier: core
        overrides:
          simulation:
            pipeline_model: rankset_event
            record_every: 512
            policy: {name: elastic, optimizer: forced_fraction, forced_gpu_fraction: 0.50}
      - from_stage: a1_inputs
        workload_ids: [sl-b16-i2k-o4k, ll-b16-i16k-o8k]
        id_prefix: a1e-p75-
        variant: forced_p75
        tier: core
        overrides:
          simulation:
            pipeline_model: rankset_event
            record_every: 512
            policy: {name: elastic, optimizer: forced_fraction, forced_gpu_fraction: 0.75}
      - from_stage: a1_inputs
        workload_ids: [sl-b16-i2k-o4k, ll-b16-i16k-o8k]
        id_prefix: a1e-p100-
        variant: forced_p100
        tier: core
        overrides:
          simulation:
            pipeline_model: rankset_event
            record_every: 512
            policy: {name: elastic, optimizer: forced_fraction, forced_gpu_fraction: 1.0}

  a1_ideal:
    description: Split-specific merge/statistics overhead upper-bound ablation.
    derived_cases:
      - from_stage: a1_inputs
        workload_ids: [sl-b16-i2k-o4k, ll-b16-i16k-o8k]
        id_prefix: a1i-p25-
        variant: ideal_p25
        tier: core
        overrides:
          simulation:
            split_overhead_scale: 0.0
            policy: {name: elastic, optimizer: forced_fraction, forced_gpu_fraction: 0.25}
      - from_stage: a1_inputs
        workload_ids: [sl-b16-i2k-o4k, ll-b16-i16k-o8k]
        id_prefix: a1i-p50-
        variant: ideal_p50
        tier: core
        overrides:
          simulation:
            split_overhead_scale: 0.0
            policy: {name: elastic, optimizer: forced_fraction, forced_gpu_fraction: 0.50}
      - from_stage: a1_inputs
        workload_ids: [sl-b16-i2k-o4k, ll-b16-i16k-o8k]
        id_prefix: a1i-p75-
        variant: ideal_p75
        tier: core
        overrides:
          simulation:
            split_overhead_scale: 0.0
            policy: {name: elastic, optimizer: forced_fraction, forced_gpu_fraction: 0.75}

  a2_offline:
    description: CHIME, best forced-static candidate, and dynamic future-KV placement.
    derived_cases:
      - from_stage: a1_inputs
        id_prefix: a2-chime-
        variant: chime
        description_prefix: CHIME control
      - from_stage: a1_inputs
        id_prefix: a2-dynamic-
        variant: dynamic_future_kv
        description_prefix: event and epoch driven lifetime placement
        overrides:
          simulation:
            policy:
              name: elastic
              optimizer: lifetime_greedy
              prediction: oracle
              decision_interval: 256
              planning_horizon_tokens: 256
              lifetime_evaluation_stride_tokens: 64
              min_segment_tokens: 256
              min_switch_interval: 512
              relative_improvement_threshold: 0.002
              max_switches_per_decision: 8
              event_driven_replan: true

  a2_event:
    description: Event-DAG replay of CHIME and dynamic placement at B16.
    derived_cases:
      - from_stage: a1_inputs
        workload_ids: [sl-b16-i2k-o4k, ll-b16-i16k-o8k]
        id_prefix: a2e-chime-
        variant: chime
        tier: core
        overrides: {simulation: {pipeline_model: rankset_event, record_every: 512}}
      - from_stage: a1_inputs
        workload_ids: [sl-b16-i2k-o4k, ll-b16-i16k-o8k]
        id_prefix: a2e-dynamic-
        variant: dynamic_future_kv
        tier: core
        overrides:
          simulation:
            pipeline_model: rankset_event
            record_every: 512
            policy:
              name: elastic
              optimizer: lifetime_greedy
              prediction: oracle
              decision_interval: 256
              planning_horizon_tokens: 256
              lifetime_evaluation_stride_tokens: 64
              min_segment_tokens: 256
              min_switch_interval: 512
              relative_improvement_threshold: 0.002
              max_switches_per_decision: 8
              event_driven_replan: true

  a3_inputs:
    description: >-
      Decode-ready online pilot traces. Nominal rates are anchored to the
      paired CHIME B16 screening service rates; realized offered rate is
      recorded from each generated trace.
    cases:
      - id: on-sl-r50
        tier: core
        scenario: online_stationary
        template: chime_online
        tags: [short_input, long_output, poisson, nominal_rho50]
        overrides:
          workload: {synthetic: {arrival_rate_rps: 0.0174}}
      - id: on-sl-r85
        tier: smoke
        scenario: online_stationary
        template: chime_online
        tags: [short_input, long_output, poisson, nominal_rho85]
        overrides:
          workload: {synthetic: {arrival_rate_rps: 0.0297}}
      - id: on-sl-r110
        tier: core
        scenario: online_stationary
        template: chime_online
        tags: [short_input, long_output, poisson, nominal_rho110]
        overrides:
          workload: {synthetic: {arrival_rate_rps: 0.0384}}
      - id: on-ll-r50
        tier: core
        scenario: online_stationary
        template: chime_online
        tags: [long_input, long_output, poisson, nominal_rho50]
        overrides:
          workload:
            synthetic: {arrival_rate_rps: 0.00205, input_tokens: 16384, output_tokens: 8192}
          simulation: {slo_queue_ms: 600000, slo_tpot_ms: 720}
      - id: on-ll-r85
        tier: smoke
        scenario: online_stationary
        template: chime_online
        tags: [long_input, long_output, poisson, nominal_rho85]
        overrides:
          workload:
            synthetic: {arrival_rate_rps: 0.00349, input_tokens: 16384, output_tokens: 8192}
          simulation: {slo_queue_ms: 600000, slo_tpot_ms: 720}
      - id: on-ll-r110
        tier: core
        scenario: online_stationary
        template: chime_online
        tags: [long_input, long_output, poisson, nominal_rho110]
        overrides:
          workload:
            synthetic: {arrival_rate_rps: 0.00451, input_tokens: 16384, output_tokens: 8192}
          simulation: {slo_queue_ms: 600000, slo_tpot_ms: 720}
      - id: on-mix-r50
        tier: core
        scenario: online_stationary
        template: chime_online
        tags: [mixed_input, long_output, poisson, nominal_rho50]
        overrides:
          workload:
            synthetic:
              arrival_rate_rps: 0.00367
              classes:
                - {weight: 1, input_tokens: 2048, output_tokens: 4096}
                - {weight: 1, input_tokens: 16384, output_tokens: 8192}
          simulation: {slo_queue_ms: 600000, slo_tpot_ms: 720}
      - id: on-mix-r85
        tier: smoke
        scenario: online_stationary
        template: chime_online
        tags: [mixed_input, long_output, poisson, nominal_rho85]
        overrides:
          workload:
            synthetic:
              arrival_rate_rps: 0.00624
              classes:
                - {weight: 1, input_tokens: 2048, output_tokens: 4096}
                - {weight: 1, input_tokens: 16384, output_tokens: 8192}
          simulation: {slo_queue_ms: 600000, slo_tpot_ms: 720}
      - id: on-mix-r110
        tier: core
        scenario: online_stationary
        template: chime_online
        tags: [mixed_input, long_output, poisson, nominal_rho110]
        overrides:
          workload:
            synthetic:
              arrival_rate_rps: 0.00808
              classes:
                - {weight: 1, input_tokens: 2048, output_tokens: 4096}
                - {weight: 1, input_tokens: 16384, output_tokens: 8192}
          simulation: {slo_queue_ms: 600000, slo_tpot_ms: 720}
      - id: on-mix-burst-r85
        tier: core
        scenario: online_burst
        template: chime_online
        tags: [mixed_input, long_output, burst, nominal_rho85]
        overrides:
          workload:
            synthetic:
              arrival_rate_rps: 0.00624
              arrival_pattern: burst
              burst_size: 8
              classes:
                - {weight: 1, input_tokens: 2048, output_tokens: 4096}
                - {weight: 1, input_tokens: 16384, output_tokens: 8192}
          simulation: {slo_queue_ms: 600000, slo_tpot_ms: 720}
    derived_cases:
      - from_stage: a3_inputs
        id_prefix: s23-
        variant: input_seed23
        workload_id_suffix: -s23
        description_prefix: independent paired Poisson seed 23
        overrides:
          workload: {synthetic: {seed: 23}}

  a3_online:
    description: >-
      Online CHIME control, two static future-KV request splits, and an
      arrived-request-only dynamic policy. No policy can inspect future arrivals.
    derived_cases:
      - from_stage: a3_inputs
        id_prefix: a3-chime-
        variant: chime
        description_prefix: CHIME control
      - from_stage: a3_inputs
        id_prefix: a3-static25-
        variant: online_static_p25
        description_prefix: arrival-time static 25 percent GPU writers
        overrides:
          simulation:
            policy:
              name: elastic
              optimizer: online_static_fraction
              forced_gpu_fraction: 0.25
              event_driven_replan: true
      - from_stage: a3_inputs
        id_prefix: a3-static50-
        variant: online_static_p50
        description_prefix: arrival-time static 50 percent GPU writers
        overrides:
          simulation:
            policy:
              name: elastic
              optimizer: online_static_fraction
              forced_gpu_fraction: 0.50
              event_driven_replan: true
      - from_stage: a3_inputs
        id_prefix: a3-dynamic-
        variant: dynamic_future_kv
        description_prefix: arrived-request-only dynamic future-KV placement
        overrides:
          simulation:
            policy:
              name: elastic
              optimizer: lifetime_greedy
              prediction: oracle
              decision_interval: 256
              planning_horizon_tokens: 256
              lifetime_evaluation_stride_tokens: 128
              min_segment_tokens: 256
              min_switch_interval: 512
              relative_improvement_threshold: 0.002
              max_switches_per_decision: 8
              event_driven_replan: true
              require_source_bottleneck: true

  a3_event:
    description: >-
      Rankset-event execution of three seed-7 online representatives. Dynamic
      actions use the analytic policy model, while every simulated iteration
      and reported metric uses the event DAG.
    derived_cases:
      - from_stage: a3_inputs
        workload_ids: [on-sl-r85, on-ll-r85, on-mix-r85]
        id_prefix: a3e-chime-
        variant: chime
        tier: core
        overrides:
          workload: {synthetic: {count: 8}}
          simulation: {pipeline_model: rankset_event, record_every: 512}
      - from_stage: a3_inputs
        workload_ids: [on-sl-r85, on-ll-r85, on-mix-r85]
        id_prefix: a3e-static50-
        variant: online_static_p50
        tier: core
        overrides:
          workload: {synthetic: {count: 8}}
          simulation:
            pipeline_model: rankset_event
            record_every: 512
            policy:
              name: elastic
              optimizer: online_static_fraction
              forced_gpu_fraction: 0.50
              event_driven_replan: true
      - from_stage: a3_inputs
        workload_ids: [on-sl-r85, on-ll-r85, on-mix-r85]
        id_prefix: a3e-dynamic-
        variant: dynamic_future_kv
        tier: core
        overrides:
          workload: {synthetic: {count: 8}}
          simulation:
            pipeline_model: rankset_event
            policy_pipeline_model: analytic
            record_every: 512
            policy:
              name: elastic
              optimizer: lifetime_greedy
              prediction: oracle
              decision_interval: 256
              planning_horizon_tokens: 256
              lifetime_evaluation_stride_tokens: 128
              min_segment_tokens: 256
              min_switch_interval: 512
              relative_improvement_threshold: 0.002
              max_switches_per_decision: 8
              event_driven_replan: true
              require_source_bottleneck: true

  a2_sensitivity:
    description: >-
      Analytic paired sensitivity for the long-input B16 case. Each CHIME
      control receives the same hardware perturbation as its dynamic pair.
    derived_cases:
      - from_stage: a1_inputs
        workload_ids: [ll-b16-i16k-o8k]
        id_prefix: a2sens-setup1-chime-
        workload_id_suffix: -setup1
        variant: chime
        tier: core
        overrides:
          hardware:
            gpu: {segment_setup_us: 1.0}
            pim: {segment_setup_us: 1.0}
      - from_stage: a1_inputs
        workload_ids: [ll-b16-i16k-o8k]
        id_prefix: a2sens-setup1-dynamic-
        workload_id_suffix: -setup1
        variant: dynamic_future_kv
        tier: core
        overrides:
          hardware:
            gpu: {segment_setup_us: 1.0}
            pim: {segment_setup_us: 1.0}
          simulation:
            policy:
              name: elastic
              optimizer: lifetime_greedy
              prediction: oracle
              decision_interval: 256
              lifetime_evaluation_stride_tokens: 64
              min_segment_tokens: 256
              min_switch_interval: 512
              relative_improvement_threshold: 0.002
              max_switches_per_decision: 8
              event_driven_replan: true
      - from_stage: a1_inputs
        workload_ids: [ll-b16-i16k-o8k]
        id_prefix: a2sens-reserve64-chime-
        workload_id_suffix: -reserve64
        variant: chime
        tier: core
        overrides: {hardware: {gpu: {runtime_reserve_gib: 64}}}
      - from_stage: a1_inputs
        workload_ids: [ll-b16-i16k-o8k]
        id_prefix: a2sens-reserve64-dynamic-
        workload_id_suffix: -reserve64
        variant: dynamic_future_kv
        tier: core
        overrides:
          hardware: {gpu: {runtime_reserve_gib: 64}}
          simulation:
            policy:
              name: elastic
              optimizer: lifetime_greedy
              prediction: oracle
              decision_interval: 256
              lifetime_evaluation_stride_tokens: 64
              min_segment_tokens: 256
              min_switch_interval: 512
              relative_improvement_threshold: 0.002
              max_switches_per_decision: 8
              event_driven_replan: true
      - from_stage: a1_inputs
        workload_ids: [ll-b16-i16k-o8k]
        id_prefix: a2sens-link30-chime-
        workload_id_suffix: -link30
        variant: chime
        tier: core
        overrides: {hardware: {link: {host_to_pim_gbps: 30, pim_to_host_gbps: 30}}}
      - from_stage: a1_inputs
        workload_ids: [ll-b16-i16k-o8k]
        id_prefix: a2sens-link30-dynamic-
        workload_id_suffix: -link30
        variant: dynamic_future_kv
        tier: core
        overrides:
          hardware: {link: {host_to_pim_gbps: 30, pim_to_host_gbps: 30}}
          simulation:
            policy:
              name: elastic
              optimizer: lifetime_greedy
              prediction: oracle
              decision_interval: 256
              lifetime_evaluation_stride_tokens: 64
              min_segment_tokens: 256
              min_switch_interval: 512
              relative_improvement_threshold: 0.002
              max_switches_per_decision: 8
              event_driven_replan: true
      - from_stage: a1_inputs
        workload_ids: [ll-b16-i16k-o8k]
        id_prefix: a2sens-combined-chime-
        workload_id_suffix: -combined
        variant: chime
        tier: core
        overrides:
