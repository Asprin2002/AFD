model: gpt175b
hardware:
  preset: chime_a100
  gpu:
    runtime_reserve_gib: 0
workload:
  type: trace_serving
  synthetic:
    count: 48
    seed: 0
    arrival_rate_rps: 0.08
    input_tokens:
      distribution: normal
      mean: 5200
      std: 1000
      min: 4096
      max: 7168
    output_tokens:
      distribution: normal
      mean: 2048
      std: 1024
      min: 256
      max: 4096
simulation:
  max_batch_size: 16
  fidelity: tile
  pipeline_model: analytic
  subbatch_scheduler: lpt
  operator_mapping: chime
  record_every: 1000000
  admission_scheduler: fcfs
  admission_reservation: none
  allow_gpu_prompt_fallback: false
  slo_queue_ms: 2000
  slo_tpot_ms: 130
  slo_attainment_target: 0.99
  policy:
    name: elastic
    optimizer: rolling_beam
    prediction: oracle
    beam_include_future_arrivals: true
    decision_interval: 64
    planning_horizon_tokens: 256
    beam_depth: 4
    beam_width: 3
    beam_request_candidates: 2
    beam_evaluation_stride_tokens: 8
    beam_terminal_samples: 8
    beam_terminal_mode: tail_lifetime
    min_segment_tokens: 64
    min_switch_interval: 128
    relative_improvement_threshold: 0.001
    max_switches_per_decision: 8
    event_driven_replan: true
